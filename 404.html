<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Sherrick Web</title>
  <meta name="description" content="Kenyan web development for startups & SMEs" />
  <meta name="geo.region" content="KE" />
  <meta name="geo.placename" content="Nairobi" />
  <link rel="canonical" href="https://sherrickweb.co.ke" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Open Sans', sans-serif;
      background: linear-gradient(135deg, #0a3d62, #6c5ce7);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #e0e0e0;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #FFD700;
      color: #0a3d62;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      padding: 12px 32px;
      border-radius: 30px;
      text-decoration: none;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .home-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="home-icon">🏠</div>
    <h1>Page Not Found</h1>
    <p>Oops! The page you're looking for doesn’t exist — or got lost in translation (we speak Swahili ✅).</p>
    <a href="/" class="btn">Back to Home</a>
  </div>
</body>
</html>
