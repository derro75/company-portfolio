# netlify.toml — Fixed & Simplified for Sherrick Web
# Place in root of your project

# Redirects (order matters!)
[[redirects]]
  from = "https://www.sherrickweb.co.ke/*"
  to = "https://sherrickweb.co.ke/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/services"
  to = "/#advantage"
  status = 301

# Fallback for SPA/hash routing (MUST come LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Custom 404 (Netlify auto-uses /404.html if present)
# No need for explicit 404 redirect if file exists

# Headers: Performance + Security
[[headers]]
  for = "/*"
  [headers.values]
    # Brotli compression (auto-negotiated — no need to force "br")
    # Netlify applies Brotli by default for supported clients ✅
    
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

    # Cache static assets (1 year)
    Cache-Control = "public, max-age=31536000, immutable"