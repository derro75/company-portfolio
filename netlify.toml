[build]
  publish = "dist"  # or "build", "out", etc — match your output folder
  command = "npm run build"  # or your actual build script

# CRITICAL: Prevent stale HTML — enables instant sync between .co.ke and Netlify
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Optional: allow caching for static assets (speeds up repeat visits)
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optional: enforce HTTPS + HSTS (good for SEO/security)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"