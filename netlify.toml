# netlify.toml — Optimized for Sherrick Web (JS-enhanced static site)
# Works with your toggle nav, smooth scroll, and form JS

# Redirects: Clean URLs + www handling
[[redirects]]
  from = "https://www.sherrickweb.co.ke/*"
  to = "https://sherrickweb.co.ke/:splat"
  status = 301
  force = true

# Anchor-based "pages" — SEO & shareability
[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/services"
  to = "/#advantage"
  status = 301

# ✅ Critical: SPA-like fallback LAST
# Allows deep links (e.g., shared /#portfolio) to load index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers: Safe & performant for JS sites
[[headers]]
  for = "/*"
  [headers.values]
    # Let Netlify auto-negotiate compression (br/gzip) — safest for JS
    # → No forced "br"

    # Security (won’t break JS)
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Cache static assets (JS/CSS/Images) — speeds up repeat visits
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML less aggressively (you update content)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"