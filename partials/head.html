<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherrick Web</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-head">
  <!-- Logo -->
  <div class="logo">
    <img src="\sherrick-logo.png" width="300px" height="auto" alt="Sherrick Web">
  </div>

  <!-- Contact Section (Phones + Separator + Emails + Socials) -->
  <div class="contact-sections">
    <!-- Phone Numbers -->
    <div class="calls">
      <div class="call">
        <i class="bi bi-telephone fs-2 text-primary"></i>
        <span>+254 111 808 737</span>
      </div>
      <div class="call">
        <i class="bi bi-phone fs-2 text-primary"></i>
        <span>+254 114 531 335</span>
      </div>
    </div>

    <!-- Vertical Separator (Orange) -->
    <div class="separator"></div>

    <!-- Email Addresses -->
    <div class="emails">
      <div class="email">
        <i class="bi bi-envelope fs-2 text-primary"></i>
        <span>info@sherrickweb.co.ke</span>
      </div>
      <div class="email">
        <i class="bi bi-mailbox fs-2 text-primary"></i>
        <span>hello@sherrickweb.co.ke</span>
      </div>
    </div>

    <!-- Social Icons (Circles) -->
    <div class="socials">
      <a href="#" class="social-link" aria-label="Facebook">
        <i class="bi bi-facebook"></i>
      </a>
      <a href="#" class="social-link" aria-label="Twitter">
        <i class="bi bi-twitter"></i>
      </a>
      <a href="#" class="social-link" aria-label="Instagram">
        <i class="bi bi-instagram"></i>
      </a>
      <a href="#" class="social-link" aria-label="LinkedIn">
        <i class="bi bi-linkedin"></i>
      </a>
    </div>
  </div>
</div>
</body>
</html>
